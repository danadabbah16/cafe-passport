# Passwords come from .env (gitignored); see .env.example.
services:
  cafes:
    build: ./services/cafes
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=mssql://cafes_app:${CAFES_DB_PASSWORD}@db:1433/cafes
      - UI_ORIGIN=http://localhost:8080
    depends_on:
      db-init:
        condition: service_completed_successfully

  analytics:
    build: ./services/analytics
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=mssql://analytics_app:${ANALYTICS_DB_PASSWORD}@db:1433/analytics
      - CAFES_URL=http://cafes:8000
      - CAFES_TIMEOUT_S=2
      - UI_ORIGIN=http://localhost:8080
    depends_on:
      db-init:
        condition: service_completed_successfully

  ui:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - CAFES_DB_PASSWORD=${CAFES_DB_PASSWORD}
      - ANALYTICS_DB_PASSWORD=${ANALYTICS_DB_PASSWORD}
    volumes:
      - ./db:/scripts:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i /scripts/init.sql -v CAFES_DB_PASSWORD=\"$$CAFES_DB_PASSWORD\" ANALYTICS_DB_PASSWORD=\"$$ANALYTICS_DB_PASSWORD\""]

volumes:
  db-data: