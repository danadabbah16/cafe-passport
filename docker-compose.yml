services:
  cafes:
    build: ./services/cafes
    ports:
      - "8001:8000"
    environment:
      - DATA_DIR=/data
      - UI_ORIGIN=http://localhost:8080
    volumes:
      - cafes-data:/data

  analytics:
    build: ./services/analytics
    ports:
      - "8002:8000"
    environment:
      - CAFES_URL=http://cafes:8000
      - CAFES_TIMEOUT_S=2
      - UI_ORIGIN=http://localhost:8080

  ui:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Pass123
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Pass123' -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db-init:/scripts
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "db", "-U", "sa", "-P", "YourStrong!Pass123", "-C", "-i", "/scripts/init.sql"]

volumes:
  cafes-data: